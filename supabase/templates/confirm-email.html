<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Kaenz email</title>
  </head>
  <body style="margin:0;padding:0;background:#07111f;font-family:Georgia,serif;color:#f4f7fb;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#07111f;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#0e1c33;border:1px solid #1c3558;border-radius:16px;padding:32px 28px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-family:Arial,sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#00a1d6;">Kaenz</p>
                <h1 style="margin:0 0 16px;font-family:Arial,sans-serif;font-size:28px;line-height:1.2;color:#ffffff;">Verify your email</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#d5deea;">Confirm this address to use Kaenz and book a trip. The link opens the same Kaenz site where you signed up.</p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#00a1d6;color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:700;text-decoration:none;padding:14px 22px;border-radius:8px;">Confirm your email</a>
                </p>
                <p style="margin:0;font-family:Arial,sans-serif;font-size:12px;line-height:1.5;color:#8ea0b8;">Kaenz is a product of Salvazion Inc. If you did not create an account, you can ignore this message.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
